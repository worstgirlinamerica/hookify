name: hookify

on:
  schedule:
    # every 10 minutes (GitHub may delay this during high load)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal check/diff/alert. preview = send real embeds for the most recent products, doesn't touch saved state."
        required: true
        default: "run"
        type: choice
        options:
          - run
          - preview

# Prevent overlapping runs from racing on the state files
concurrency:
  group: hookify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tracker
        env:
          STORES_CONFIG: ${{ secrets.STORES_CONFIG }}
          HOOKIFY_MODE: ${{ inputs.mode || 'run' }}
        run: python3 tracker.py

      - name: Commit updated state
        if: ${{ inputs.mode != 'preview' }}
        run: |
          git config user.name "hookify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          git push
